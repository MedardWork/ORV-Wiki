<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ORV Wiki — The Star Stream Archive</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --void:#06070d;
  --space:#0c0f1c;
  --night:#11142a;
  --panel:#161b2e;
  --panel-2:#1c2240;
  --panel-3:#252b4d;
  --border:#2a3158;
  --border-bright:#3d4670;
  --gold:#f0c674;
  --gold-bright:#ffd97c;
  --gold-dim:#a08348;
  --gold-glow:rgba(240,198,116,.35);
  --text:#e6e2d3;
  --text-2:#a8a496;
  --text-3:#6c6a5d;
  --purple:#8b5cf6;
  --cyan:#5eead4;
  --crimson:#c4504c;
  --danger:#ef4444;
  --success:#22c55e;
  --spoiler-bg:#1a1325;
  --spoiler-border:#3a2960;
  --shadow-lg:0 12px 40px -8px rgba(0,0,0,.6),0 4px 12px -2px rgba(0,0,0,.4);
  --shadow-glow:0 0 24px -4px var(--gold-glow);
  --serif:'Cinzel',Georgia,serif;
  --sans:'Inter',-apple-system,system-ui,sans-serif;
  --mono:'JetBrains Mono',Menlo,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:var(--sans);
  font-size:15px;
  line-height:1.6;
  color:var(--text);
  background:var(--void);
  overflow-x:hidden;
  min-height:100vh;
  position:relative;
}
body::before{
  content:'';
  position:fixed;inset:0;
  background:
    radial-gradient(ellipse 80% 50% at 50% -20%,rgba(139,92,246,.12),transparent 60%),
    radial-gradient(ellipse 60% 40% at 100% 100%,rgba(240,198,116,.06),transparent 60%),
    linear-gradient(180deg,var(--void) 0%,var(--space) 40%,var(--void) 100%);
  z-index:-2;
  pointer-events:none;
}
#starfield{position:fixed;inset:0;z-index:-1;pointer-events:none}
::selection{background:var(--gold);color:var(--void)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:var(--space)}
::-webkit-scrollbar-thumb{background:var(--panel-3);border-radius:6px}
::-webkit-scrollbar-thumb:hover{background:var(--gold-dim)}

/* Typography */
h1,h2,h3,h4{font-family:var(--serif);font-weight:600;line-height:1.2;letter-spacing:.02em}
h1{font-size:2.4rem;color:var(--gold)}
h2{font-size:1.7rem;color:var(--gold-bright)}
h3{font-size:1.25rem;color:var(--gold)}
h4{font-size:1.05rem;color:var(--text)}
a{color:var(--gold);text-decoration:none;transition:color .15s}
a:hover{color:var(--gold-bright);text-shadow:0 0 12px var(--gold-glow)}
p{margin-bottom:.8em}
code{font-family:var(--mono);font-size:.9em;background:var(--panel);padding:1px 6px;border-radius:3px;color:var(--cyan)}
hr{border:none;height:1px;background:linear-gradient(90deg,transparent,var(--border),transparent);margin:1.5rem 0}

/* Header */
header.site{
  position:sticky;top:0;z-index:100;
  background:linear-gradient(180deg,rgba(6,7,13,.95),rgba(12,15,28,.85));
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border);
  box-shadow:0 4px 20px rgba(0,0,0,.4);
}
.nav{
  display:flex;align-items:center;
  max-width:1400px;margin:0 auto;
  padding:.6rem 1.5rem;gap:1rem;
}
.brand{
  display:flex;align-items:center;gap:.6rem;
  font-family:var(--serif);font-weight:700;font-size:1.15rem;
  color:var(--gold-bright);letter-spacing:.08em;text-transform:uppercase;
  cursor:pointer;user-select:none;
  text-shadow:0 0 16px var(--gold-glow);
  white-space:nowrap;
}
.brand-mark{
  display:inline-block;width:28px;height:28px;
  background:radial-gradient(circle,var(--gold-bright),var(--gold-dim));
  border-radius:50%;position:relative;
  box-shadow:0 0 18px var(--gold-glow);
}
.brand-mark::before,.brand-mark::after{
  content:'';position:absolute;left:50%;top:50%;
  width:80%;height:1px;background:var(--gold-bright);
  transform:translate(-50%,-50%);
}
.brand-mark::after{transform:translate(-50%,-50%) rotate(90deg)}
.brand-tag{font-size:.65rem;color:var(--text-3);font-weight:400;letter-spacing:.15em;display:block;margin-top:-2px}

.menubar{display:flex;align-items:center;gap:.25rem;flex-wrap:wrap}
.menu{position:relative}
.menu-btn{
  background:none;border:1px solid transparent;color:var(--text-2);
  padding:.5rem .85rem;font:inherit;font-size:.88rem;
  cursor:pointer;border-radius:6px;
  display:inline-flex;align-items:center;gap:.35rem;
  letter-spacing:.04em;text-transform:uppercase;
  transition:all .15s;
}
.menu-btn:hover,.menu.open .menu-btn{
  color:var(--gold-bright);
  background:var(--panel);
  border-color:var(--border);
}
.menu-btn .caret{font-size:.65rem;opacity:.6;transition:transform .2s}
.menu.open .caret{transform:rotate(180deg)}

.menu-panel{
  position:absolute;top:calc(100% + 8px);left:0;
  min-width:220px;
  background:linear-gradient(180deg,var(--panel),var(--space));
  border:1px solid var(--border-bright);
  border-radius:8px;
  padding:.4rem;
  box-shadow:var(--shadow-lg),0 0 30px -10px var(--gold-glow);
  opacity:0;transform:translateY(-6px);pointer-events:none;
  transition:all .18s ease-out;
  z-index:120;
}
.menu.open .menu-panel{opacity:1;transform:translateY(0);pointer-events:auto}
.menu-item{
  display:flex;align-items:center;gap:.65rem;
  padding:.55rem .75rem;border-radius:5px;
  color:var(--text);font-size:.88rem;
  cursor:pointer;transition:all .12s;
  background:none;border:none;width:100%;text-align:left;
  font-family:inherit;
}
.menu-item:hover{background:var(--panel-3);color:var(--gold-bright)}
.menu-item .icon{
  width:22px;height:22px;
  display:inline-flex;align-items:center;justify-content:center;
  color:var(--gold);font-size:1rem;
  background:rgba(240,198,116,.08);
  border-radius:4px;
  flex-shrink:0;
}
.menu-divider{height:1px;background:var(--border);margin:.4rem 0}
.menu-label{
  padding:.45rem .75rem .25rem;font-size:.65rem;
  color:var(--text-3);text-transform:uppercase;letter-spacing:.12em;
}

.search-wrap{flex:1;max-width:340px;position:relative}
.search-input{
  width:100%;padding:.55rem 2.4rem .55rem 2.2rem;
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:6px;
  color:var(--text);font:inherit;font-size:.88rem;
  transition:all .15s;
}
.search-input:focus{
  outline:none;
  border-color:var(--gold-dim);
  box-shadow:0 0 0 3px rgba(240,198,116,.12);
}
.search-icon{
  position:absolute;left:.7rem;top:50%;transform:translateY(-50%);
  color:var(--text-3);pointer-events:none;font-size:.95rem;
}
.search-results{
  position:absolute;top:calc(100% + 6px);left:0;right:0;
  background:linear-gradient(180deg,var(--panel),var(--space));
  border:1px solid var(--border-bright);border-radius:8px;
  max-height:60vh;overflow-y:auto;
  box-shadow:var(--shadow-lg);
  z-index:130;
}
.search-result{
  padding:.6rem .8rem;cursor:pointer;
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:.6rem;
}
.search-result:last-child{border:none}
.search-result:hover{background:var(--panel-3)}
.search-result .meta{font-size:.7rem;color:var(--text-3);text-transform:uppercase;letter-spacing:.08em}

.chapter-pill{
  display:inline-flex;align-items:center;gap:.4rem;
  padding:.4rem .75rem;
  background:linear-gradient(135deg,rgba(240,198,116,.1),rgba(139,92,246,.1));
  border:1px solid var(--border);
  border-radius:20px;font-size:.78rem;
  color:var(--gold-bright);cursor:pointer;
  transition:all .15s;white-space:nowrap;
  font-family:var(--mono);
}
.chapter-pill:hover{
  border-color:var(--gold-dim);
  box-shadow:0 0 16px rgba(240,198,116,.2);
}

.user-btn{
  display:inline-flex;align-items:center;gap:.5rem;
  background:var(--panel);border:1px solid var(--border);
  color:var(--text);padding:.4rem .85rem;
  border-radius:6px;cursor:pointer;font:inherit;font-size:.85rem;
  transition:all .15s;
}
.user-btn:hover{border-color:var(--gold-dim);color:var(--gold-bright)}
.user-avatar{
  width:24px;height:24px;border-radius:50%;
  background:linear-gradient(135deg,var(--purple),var(--gold));
  display:inline-flex;align-items:center;justify-content:center;
  font-size:.7rem;font-weight:700;color:var(--void);
}
.notif-dot{
  position:absolute;top:-2px;right:-2px;
  width:8px;height:8px;border-radius:50%;
  background:var(--crimson);
  box-shadow:0 0 8px var(--crimson);
}
.notif-btn{position:relative}

/* Buttons */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:.5rem;
  padding:.6rem 1.1rem;border-radius:6px;
  font:inherit;font-size:.88rem;font-weight:500;
  cursor:pointer;transition:all .15s;
  border:1px solid transparent;
  letter-spacing:.02em;text-decoration:none;
  white-space:nowrap;
}
.btn-primary{
  background:linear-gradient(180deg,var(--gold),var(--gold-dim));
  color:var(--void);font-weight:600;
  box-shadow:0 4px 14px -4px var(--gold-glow);
}
.btn-primary:hover{
  background:linear-gradient(180deg,var(--gold-bright),var(--gold));
  box-shadow:0 6px 20px -4px var(--gold-glow);
  transform:translateY(-1px);
}
.btn-secondary{
  background:var(--panel);border-color:var(--border);
  color:var(--text);
}
.btn-secondary:hover{border-color:var(--gold-dim);color:var(--gold-bright)}
.btn-ghost{background:transparent;color:var(--text-2)}
.btn-ghost:hover{background:var(--panel);color:var(--gold-bright)}
.btn-danger{background:var(--panel);color:var(--danger);border-color:rgba(239,68,68,.3)}
.btn-danger:hover{background:rgba(239,68,68,.1);border-color:var(--danger)}
.btn-sm{padding:.35rem .7rem;font-size:.78rem}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}

/* Layout */
main.app{
  max-width:1400px;margin:0 auto;
  padding:2rem 1.5rem 4rem;
  min-height:calc(100vh - 70px);
}
.view{animation:fadeIn .35s ease-out}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.crumbs{
  display:flex;align-items:center;gap:.4rem;
  font-size:.8rem;color:var(--text-3);
  margin-bottom:1.2rem;
  text-transform:uppercase;letter-spacing:.08em;
}
.crumbs a{color:var(--text-2)}
.crumbs .sep{color:var(--text-3);opacity:.5}

/* Hero / Home */
.hero{
  text-align:center;
  padding:4rem 1rem 3rem;
  position:relative;
}
.hero h1{
  font-size:clamp(2.2rem,5vw,3.6rem);
  background:linear-gradient(180deg,var(--gold-bright),var(--gold-dim));
  -webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;
  margin-bottom:.4rem;
  text-shadow:0 0 60px rgba(240,198,116,.2);
}
.hero .sub{
  font-family:var(--serif);font-style:italic;
  color:var(--text-2);font-size:1.05rem;
  letter-spacing:.05em;margin-bottom:.4rem;
}
.hero .quote{
  max-width:600px;margin:1.4rem auto 0;
  color:var(--text-2);font-style:italic;font-size:1rem;
  border-left:2px solid var(--gold-dim);
  padding-left:1.2rem;text-align:left;
}
.hero .quote-author{display:block;margin-top:.5rem;color:var(--text-3);font-size:.85rem;font-style:normal}
.hero-cta{
  margin-top:2rem;display:flex;gap:.8rem;justify-content:center;flex-wrap:wrap;
}

.section-title{
  display:flex;align-items:baseline;justify-content:space-between;
  margin:2.5rem 0 1.2rem;gap:1rem;flex-wrap:wrap;
}
.section-title h2{
  display:flex;align-items:center;gap:.6rem;
}
.section-title .ornament{
  flex:1;height:1px;
  background:linear-gradient(90deg,var(--border),transparent);
  margin-left:.8rem;min-width:40px;
}

/* Category grid (home) */
.cat-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(180px,1fr));
  gap:.9rem;
}
.cat-tile{
  position:relative;
  background:linear-gradient(180deg,var(--panel),var(--space));
  border:1px solid var(--border);
  border-radius:8px;padding:1.1rem;
  cursor:pointer;transition:all .2s;
  overflow:hidden;
}
.cat-tile::before{
  content:'';position:absolute;inset:0;
  background:radial-gradient(circle at 80% 0%,var(--gold-glow),transparent 50%);
  opacity:0;transition:opacity .25s;
}
.cat-tile:hover{
  border-color:var(--gold-dim);
  transform:translateY(-2px);
  box-shadow:0 8px 24px -8px rgba(0,0,0,.6),0 0 24px -8px var(--gold-glow);
}
.cat-tile:hover::before{opacity:1}
.cat-tile .glyph{
  display:inline-block;font-size:1.6rem;color:var(--gold);
  margin-bottom:.6rem;
  text-shadow:0 0 12px var(--gold-glow);
  position:relative;
}
.cat-tile h4{font-family:var(--serif);font-size:1.05rem;color:var(--gold-bright);margin-bottom:.3rem;position:relative}
.cat-tile p{color:var(--text-3);font-size:.78rem;margin:0;position:relative}

/* Page grid (lists) */
.page-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
  gap:1rem;
}
.page-card{
  background:linear-gradient(180deg,var(--panel),var(--space));
  border:1px solid var(--border);
  border-radius:8px;padding:1rem 1.1rem;
  cursor:pointer;transition:all .18s;
  display:flex;flex-direction:column;
  position:relative;
}
.page-card:hover{
  border-color:var(--gold-dim);
  transform:translateY(-2px);
  box-shadow:0 6px 20px -6px rgba(0,0,0,.6),0 0 16px -6px var(--gold-glow);
}
.page-card .type{
  font-size:.65rem;color:var(--gold-dim);
  text-transform:uppercase;letter-spacing:.15em;
  margin-bottom:.3rem;
}
.page-card h3{
  font-family:var(--serif);font-size:1.1rem;color:var(--gold-bright);
  margin-bottom:.4rem;line-height:1.3;
}
.page-card .desc{
  color:var(--text-2);font-size:.85rem;
  flex:1;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;
  overflow:hidden;
}
.page-card .footer{
  display:flex;justify-content:space-between;align-items:center;
  margin-top:.7rem;padding-top:.7rem;
  border-top:1px solid var(--border);
  font-size:.72rem;color:var(--text-3);
}
.page-card .ch{font-family:var(--mono);color:var(--gold-dim)}

/* Pagination */
.pagination{
  display:flex;justify-content:center;align-items:center;
  gap:.4rem;margin-top:2rem;flex-wrap:wrap;
}
.pagination .info{color:var(--text-3);font-size:.85rem;margin:0 .8rem;font-family:var(--mono)}

/* Page detail */
.detail-layout{
  display:grid;
  grid-template-columns:minmax(0,1fr) 320px;
  gap:2rem;
}
@media(max-width:900px){.detail-layout{grid-template-columns:1fr}}

.detail-header{
  background:linear-gradient(135deg,var(--panel) 0%,var(--space) 100%);
  border:1px solid var(--border);
  border-top:2px solid var(--gold-dim);
  border-radius:8px;padding:1.6rem 1.8rem;
  margin-bottom:1.4rem;position:relative;overflow:hidden;
}
.detail-header::before{
  content:'';position:absolute;top:0;right:0;
  width:200px;height:200px;
  background:radial-gradient(circle,var(--gold-glow),transparent 70%);
  pointer-events:none;
}
.detail-header .type{
  font-size:.72rem;color:var(--gold-dim);
  text-transform:uppercase;letter-spacing:.18em;
  margin-bottom:.4rem;font-weight:600;
}
.detail-header h1{font-size:2.2rem;margin-bottom:.6rem;position:relative}
.detail-header .summary{color:var(--text-2);font-size:1rem;max-width:780px;position:relative}
.detail-header .meta-row{
  display:flex;gap:1.2rem;flex-wrap:wrap;
  margin-top:1rem;font-size:.8rem;color:var(--text-3);
  position:relative;
}
.detail-header .meta-row span{display:inline-flex;align-items:center;gap:.4rem}
.detail-header .meta-row strong{color:var(--gold);font-family:var(--mono);font-weight:500}

.detail-body{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:8px;padding:1.6rem 1.8rem;
  margin-bottom:1.4rem;
}
.detail-body h2{margin-top:1.6rem;margin-bottom:.6rem;font-size:1.4rem}
.detail-body h2:first-child{margin-top:0}
.detail-body p{color:var(--text);margin-bottom:1em}

.field-row{
  display:grid;grid-template-columns:160px 1fr;gap:1rem;
  padding:.6rem 0;border-bottom:1px solid var(--border);
  font-size:.92rem;
}
.field-row:last-child{border-bottom:none}
.field-label{color:var(--text-3);text-transform:uppercase;font-size:.72rem;letter-spacing:.1em;padding-top:2px}
.field-value{color:var(--text)}

/* Sidebar */
.sidebar{display:flex;flex-direction:column;gap:1rem}
.side-card{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:8px;padding:1rem 1.1rem;
}
.side-card h4{
  font-size:.78rem;color:var(--gold-dim);
  text-transform:uppercase;letter-spacing:.12em;
  margin-bottom:.7rem;font-family:var(--sans);font-weight:600;
}
.side-card .row{
  display:flex;justify-content:space-between;
  font-size:.85rem;padding:.3rem 0;
  border-bottom:1px dashed var(--border);
}
.side-card .row:last-child{border:none}
.side-card .row .k{color:var(--text-3)}
.side-card .row .v{color:var(--text);font-family:var(--mono);font-size:.82rem}

/* Spoiler — three states.
   - .spoiler.hidden   server stripped the body; client shows a chip
   - .spoiler.revealed user has reached the reveal chapter; subtle highlight
   - .spoiler.peek     transient class added on hover/click to expose content
                       (used only for revealed spoilers; hidden ones never
                       have content to show on the client) */
.spoiler{
  position:relative;
  border-radius:4px;
  letter-spacing:.02em;
}
.spoiler.hidden{
  display:inline-block;
  background:var(--spoiler-bg);
  border:1px solid var(--spoiler-border);
  padding:1px 9px;
  color:var(--purple);font-family:var(--mono);font-size:.82rem;
  cursor:not-allowed;user-select:none;
  vertical-align:baseline;
}
.spoiler.hidden::before{
  content:'⚠';margin-right:.4rem;font-size:.9em;
}
.spoiler.revealed{
  display:inline;
  padding:1px 6px;
  background:linear-gradient(90deg,rgba(240,198,116,.08),rgba(139,92,246,.08));
  border:1px solid rgba(240,198,116,.25);
  color:var(--text);
  cursor:help;
}
.spoiler.revealed::before{
  content:'';position:absolute;left:-2px;top:0;bottom:0;width:2px;
  background:var(--gold-bright);box-shadow:0 0 6px var(--gold-glow);
}
.spoiler.revealed[data-ch]::after{
  content:'ch.' attr(data-ch);
  font-family:var(--mono);font-size:.66rem;
  color:var(--gold-dim);margin-left:.35rem;
  vertical-align:super;letter-spacing:0;
  opacity:.7;
}
/* Hidden-content banner shown above any field with hidden spoilers. */
.spoiler-banner{
  margin-top:.8rem;padding:.7rem .9rem;
  background:var(--spoiler-bg);
  border:1px dashed var(--spoiler-border);
  border-radius:6px;
  font-size:.83rem;color:var(--purple);
  display:flex;align-items:center;gap:.5rem;
}
.spoiler-banner::before{ content:'✦';font-size:1rem;color:var(--gold-bright); }

/* Comments */
.comment-thread{margin-top:.5rem}
.comment{
  border-left:2px solid var(--border);
  padding:.8rem 0 .8rem 1rem;
  margin-bottom:.4rem;
}
.comment-head{
  display:flex;align-items:center;gap:.6rem;
  margin-bottom:.4rem;font-size:.82rem;
}
.comment-head .author{color:var(--gold-bright);font-weight:500}
.comment-head .ch-tag{
  font-family:var(--mono);font-size:.72rem;
  color:var(--gold-dim);background:var(--panel-2);
  padding:1px 7px;border-radius:10px;
}
.comment-head .ago{color:var(--text-3)}
.comment-body{color:var(--text);font-size:.93rem;margin-bottom:.5rem;white-space:pre-wrap}
.comment-body.deleted{color:var(--text-3);font-style:italic}
.comment-actions{display:flex;align-items:center;gap:.3rem;flex-wrap:wrap}
.react-btn{
  background:var(--panel);border:1px solid var(--border);
  color:var(--text-2);padding:2px 8px;
  border-radius:12px;cursor:pointer;
  font:inherit;font-size:.78rem;
  display:inline-flex;align-items:center;gap:.3rem;
  transition:all .12s;
}

<script>
'use strict';

/* ============================================================
   STATE
============================================================ */
const State = {
  // Persisted preferences are loaded from localStorage on first paint and
  // re-saved whenever they change (see savePrefs()).
  apiBase: localStorage.getItem('orv.apiBase') || 'https://localhost:7138',
  ignoreSpoilers: localStorage.getItem('orv.ignoreSpoilers') === '1',
  token: null,
  user: null,
  view: { type: 'home', params: {} },
  notifUnread: 0,
  searchTimeout: null,
};

function savePrefs() {
  localStorage.setItem('orv.apiBase', State.apiBase);
  localStorage.setItem('orv.ignoreSpoilers', State.ignoreSpoilers ? '1' : '0');
}

/* ============================================================
   CONFIG
   ENTITY_TYPES drives the menubar, page-card glyphs, and the
   "fetch the entity-specific endpoint to surface narrative fields"
   logic in renderPage(). `endpoint` is a base path that supports
   `/by-slug/{slug}`; `narratives` lists the RenderedContent fields
   on the entity DTO that should appear under their own heading.
============================================================ */
const ENTITY_TYPES = {
  character:   { plural:'Characters',   single:'Character',     glyph:'☉', desc:'Incarnations and mortals across the worldlines',
                 endpoint:'/api/characters', narratives:[['biography','Biography']] },
  constellation:{plural:'Constellations',single:'Constellation', glyph:'✦', desc:'Beings of the Star Stream',
                 endpoint:'/api/constellations', narratives:[['description','Description']] },
  nebula:      { plural:'Nebulae',      single:'Nebula',        glyph:'✺', desc:'Constellation factions and alliances',
                 endpoint:'/api/nebulae', narratives:[['description','Description']] },
  dokkaebi:    { plural:'Dokkaebi',     single:'Dokkaebi',      glyph:'☄', desc:'Goblin scenario administrators',
                 endpoint:'/api/dokkaebi', narratives:[['speciality','Speciality']] },
  demon_king:  { plural:'Demon Kings',  single:'Demon King',    glyph:'☠', desc:'The 72 sovereigns of the underworld',
                 endpoint:'/api/demon-kings', narratives:[['description','Description']] },
  outer_god:   { plural:'Outer Gods',   single:'Outer God',     glyph:'◉', desc:'Beings beyond the Star Stream',
                 endpoint:'/api/outer-gods', narratives:[['description','Description']] },
  worldline:   { plural:'Worldlines',   single:'Worldline',     glyph:'∞', desc:'Parallel regression chains',
                 endpoint:'/api/worldlines', narratives:[['description','Description']] },
  fable:       { plural:'Fables',       single:'Fable',         glyph:'❦', desc:'Stories that grant power',
                 endpoint:'/api/fables', narratives:[['title','Title'],['legend','Legend']] },
  stigma:      { plural:'Stigmas',      single:'Stigma',        glyph:'✧', desc:'Powers loaned by sponsoring constellations',
                 endpoint:'/api/stigmas', narratives:[['effect','Effect']] },
  attribute:   { plural:'Attributes',   single:'Attribute',     glyph:'◈', desc:'Innate personal traits',
                 endpoint:'/api/attributes', narratives:[['effect','Effect']] },
  skill:       { plural:'Skills',       single:'Skill',         glyph:'➤', desc:'Active and passive abilities',
                 endpoint:'/api/skills', narratives:[['effect','Effect']] },
  item:        { plural:'Items',        single:'Item',          glyph:'⚔', desc:'Star relics and equipment',
                 endpoint:'/api/items', narratives:[['description','Description']] },
  location:    { plural:'Locations',    single:'Location',      glyph:'⌖', desc:'Places across worldlines and dimensions',
                 endpoint:'/api/locations', narratives:[['description','Description']] },
  scenario:    { plural:'Scenarios',    single:'Scenario',      glyph:'☰', desc:'Main, sub, hidden and bounty scenarios',
                 endpoint:'/api/scenarios', narratives:[['title','Title'],['conditions','Conditions'],['rewards','Rewards'],['penalty','Penalty']] },
  arc:         { plural:'Arcs',         single:'Arc',           glyph:'◐', desc:'Story arcs of the novel',
                 endpoint:'/api/arcs', narratives:[['summary','Summary']] },
  chapter:     { plural:'Chapters',     single:'Chapter',       glyph:'📜', desc:'Individual novel chapters' },
  event:       { plural:'Events',       single:'Event',         glyph:'⚡', desc:'Pivotal moments in the timeline',
                 endpoint:'/api/events', narratives:[['title','Title'],['description','Description']] },
  concept:     { plural:'Concepts',     single:'Concept',       glyph:'◇', desc:'Abstract ideas and rules of the world',
                 endpoint:'/api/concepts', narratives:[['definition','Definition']] },
};

const REACTIONS = [
  { type:'like',    emoji:'👍' },
  { type:'dislike', emoji:'👎' },
  { type:'heart',   emoji:'❤️' },
  { type:'laugh',   emoji:'😂' },
  { type:'sad',     emoji:'😢' },
  { type:'star',    emoji:'⭐' },
];

const MENU_GROUPS = [
  { label:'Beings',         types:['character','constellation','nebula','dokkaebi','demon_king','outer_god','worldline'] },
  { label:'Power System',   types:['fable','stigma','attribute','skill','item'] },
  { label:'Story & World',  types:['location','scenario','arc','chapter','event','concept'] },
];

/* ============================================================
   API CLIENT
============================================================ */
const api = {
  async req(method, path, body) {
    // When the user has the spoiler gate disabled, every page-related GET
    // gets ?ignoreSpoilers=true tacked on — the backend then bypasses the
    // discovery_chapter filter regardless of the JWT's current_chapter claim.
    let finalPath = path;
    if (method === 'GET' && State.ignoreSpoilers
        && (path.startsWith('/api/pages') || path.startsWith('/api/characters'))) {
      finalPath += (path.includes('?') ? '&' : '?') + 'ignoreSpoilers=true';
    }
    const url = State.apiBase.replace(/\/$/, '') + finalPath;
    const headers = { 'Accept':'application/json' };
    if (body !== undefined) headers['Content-Type'] = 'application/json';
    if (State.token) headers['Authorization'] = 'Bearer ' + State.token;
    let res;
    try {
      res = await fetch(url, { method, headers, body: body !== undefined ? JSON.stringify(body) : undefined });
    } catch (e) {
      throw new ApiError(0, 'Cannot reach the Star Stream — check your API base URL in settings.');
    }
    if (res.status === 204) return null;
    let data = null;
    const ct = res.headers.get('content-type') || '';
    if (ct.includes('json')) {
      try { data = await res.json(); } catch {}
    }
    if (!res.ok) {
      const msg = data?.detail || data?.title || data?.errors && Object.values(data.errors).flat().join('; ') || res.statusText || 'Request failed';
      throw new ApiError(res.status, msg, data);
    }
    return data;
  },
  get(p)        { return this.req('GET', p); },
  post(p, b)    { return this.req('POST', p, b ?? {}); },
  put(p, b)     { return this.req('PUT', p, b); },
  patch(p, b)   { return this.req('PATCH', p, b ?? {}); },
  del(p)        { return this.req('DELETE', p); },
};
class ApiError extends Error { constructor(s, m, d){ super(m); this.status=s; this.data=d; } }

/* ============================================================
   UTILITIES
============================================================ */
const $  = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => Array.from(r.querySelectorAll(s));
const el = (tag, props={}, ...kids) => {
  const e = document.createElement(tag);
  for (const [k,v] of Object.entries(props)) {
    if (k === 'class') e.className = v;
    else if (k === 'style') Object.assign(e.style, v);
    else if (k === 'dataset') Object.assign(e.dataset, v);
    else if (k.startsWith('on') && typeof v === 'function') e.addEventListener(k.slice(2).toLowerCase(), v);
    else if (k === 'html') e.innerHTML = v;
    else if (v !== null && v !== undefined && v !== false) e.setAttribute(k, v);
  }
  for (const k of kids.flat()) {
    if (k == null || k === false) continue;
    e.appendChild(typeof k === 'string' || typeof k === 'number' ? document.createTextNode(k) : k);
  }
  return e;
};
const escapeHtml = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtDate = s => {
  if (!s) return '—';
  const d = new Date(s);
  const diff = Date.now() - d.getTime();
  const min = 60*1000, h = 60*min, day = 24*h;
  if (diff < min) return 'just now';
  if (diff < h)   return Math.floor(diff/min) + 'm ago';
  if (diff < day) return Math.floor(diff/h)   + 'h ago';
  if (diff < 7*day) return Math.floor(diff/day)+ 'd ago';
  return d.toLocaleDateString();
};
const decodeJwt = t => {
  try {
    const p = t.split('.')[1];
    return JSON.parse(atob(p.replace(/-/g,'+').replace(/_/g,'/')));
  } catch { return null; }
};

/* ============================================================
   TOAST
============================================================ */
function toast(msg, type='info', ttl=3500) {
  const t = el('div', { class:'toast '+type }, msg);
  $('#toast-root').appendChild(t);
  setTimeout(() => { t.style.opacity='0'; t.style.transform='translateX(40px)'; t.style.transition='all .25s'; }, ttl);
  setTimeout(() => t.remove(), ttl + 300);
}

/* ============================================================
   MODAL
============================================================ */
function openModal(content, opts={}) {
  closeModal();
  const root = $('#modal-root');
  const backdrop = el('div', { class:'modal-backdrop', onclick:e => { if (e.target === backdrop) closeModal(); }});
  const m = el('div', { class:'modal'+(opts.lg ? ' lg' : ''), style:{ position:'relative' }});
  m.appendChild(el('button', { class:'modal-close', onclick:closeModal, 'aria-label':'Close' }, '×'));
  if (typeof content === 'function') {
    const inner = content(closeModal);
    if (inner instanceof Node) m.appendChild(inner);
  } else if (content instanceof Node) m.appendChild(content);
  backdrop.appendChild(m);
  root.appendChild(backdrop);
  setTimeout(() => { const f = m.querySelector('input,textarea,button'); if (f) f.focus(); }, 50);
  return m;
}
function closeModal() { $('#modal-root').innerHTML = ''; }

/* ============================================================
   STARFIELD
============================================================ */
function startStarfield() {
  const c = $('#starfield');
  const ctx = c.getContext('2d');
  let stars = [];
  function resize() {
    c.width = innerWidth * devicePixelRatio;
    c.height = innerHeight * devicePixelRatio;
    c.style.width = innerWidth+'px';
    c.style.height = innerHeight+'px';
    ctx.scale(devicePixelRatio, devicePixelRatio);
    const n = Math.floor(innerWidth*innerHeight/2200);
    stars = Array.from({length:n}, () => ({
      x: Math.random()*innerWidth,
      y: Math.random()*innerHeight,
      r: Math.random()*1.2 + 0.2,
      tw: Math.random()*Math.PI*2,
      sp: Math.random()*0.6 + 0.2,
      hue: Math.random() < 0.15 ? 'gold' : 'white',
    }));
  }
  let t = 0;
  function frame() {
    ctx.clearRect(0,0,innerWidth,innerHeight);
    for (const s of stars) {
      const a = (Math.sin(t*s.sp + s.tw) + 1) / 2 * 0.7 + 0.15;
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI*2);
      if (s.hue === 'gold') {
        ctx.fillStyle = `rgba(240,198,116,${a})`;
        ctx.shadowColor = 'rgba(240,198,116,.7)';
        ctx.shadowBlur = 6;
      } else {
        ctx.fillStyle = `rgba(220,220,240,${a})`;
        ctx.shadowBlur = 0;
      }
      ctx.fill();
    }
    ctx.shadowBlur = 0;
    t += 0.012;
    requestAnimationFrame(frame);
  }
  resize();
  addEventListener('resize', resize);
  frame();
}

function openAuth(mode='login') {
  openModal(close => {
    const root = el('div', {});

      el('button', { class:'tab'+(mode==='login'?' active':''), onclick:() => switchTab('login') }, 'Sign in'),

    );
    const form = el('div', {});
    function switchTab(m) { mode = m; renderForm(); $$('.tab', tabs).forEach((b,i) => b.classList.toggle('active', (i===0)===(m==='login'))); }
    function renderForm() {
      form.innerHTML = '';
      if (mode === 'login') {
        const idIn = el('input', { type:'text', placeholder:'username or email', autofocus:true });

          el('button', { class:'btn btn-primary', onclick:submit }, 'Sign in'),

      } else {

        const usIn = el('input', { type:'text', placeholder:'username' });
        const pwIn = el('input', { type:'password', placeholder:'password (≥ 12 chars recommended)' });
        const chIn = el('input', { type:'number', placeholder:'0', min:'0', value:'0' });
        const err = el('div', { class:'field-error', style:{ display:'none' }});
        const submit = async () => {
          err.style.display = 'none';
          try {
            const r = await api.post('/api/auth/register', {

function applyAuth(authResp) {
  State.token = authResp.accessToken || authResp.token;
  State.user  = authResp.user || decodeJwt(State.token);
  // Normalize fields possibly missing
  if (State.user) {
    State.user.username = State.user.username || State.user.unique_name || State.user.name || 'reader';
    State.user.currentChapter = State.user.currentChapter ?? Number(State.user.current_chapter) ?? 0;
    State.user.role = State.user.role || State.user.roles || 'reader';
  }
  renderUserArea();
}

  State.token = null;
  State.user = null;
  renderUserArea();
  navigate('');
  toast('Signed out');
}

  const app = $('#app');

  const head = p[0];
  if (head === 'category')   return renderCategory(p[1], p[2]);
  if (head === 'page')       return renderPage(p[1]);
  if (head === 'character')  return renderCharacter(p[1]);
  if (head === 'timeline')   return renderTimeline();

function pageCard(p) {
  const type = p.entityType || p.entity_type;
  const info = ENTITY_TYPES[type] || { glyph:'?', single:'Page' };
  const route = type === 'character' ? 'character/'+p.slug : 'page/'+p.slug;
  // Title and ShortDescription are RenderedContent. We use renderRendered
  // for the description (so hidden-spoiler chips appear inline) and let the
  // title go through the same renderer too — page titles rarely contain
  // [spoiler] markup but the renderer handles plain strings as a no-op.
  const titleNode = el('h3', {}); renderRendered(p.title, titleNode);
  const descBox = el('div', { class:'desc' });
  const summary = p.shortDescription || p.short_description;
  if (hasContent(summary)) {
    renderRendered(summary, descBox);
  } else {
    descBox.appendChild(el('span', { style:{ color:'var(--text-3)', fontStyle:'italic' }}, 'No summary yet.'));
  }
  return el('div', { class:'page-card', onclick:() => navigate(route) },
    el('div', { class:'type' }, info.glyph + '  ' + info.single),
    titleNode,
    descBox,
    el('div', { class:'footer' },
      el('span', { class:'ch' }, 'Ch. ' + (p.discoveryChapter ?? p.discovery_chapter ?? '?')),
      el('span', {}, '↗'),
    ),
  );
}

function paginator(page, pageSize, total, onJump) {
  const last = Math.max(1, Math.ceil(total / pageSize));
  const wrap = el('div', { class:'pagination' });
  wrap.appendChild(el('button', { class:'btn btn-secondary btn-sm', disabled: page<=1, onclick:() => onJump(page-1) }, '← Prev'));
  wrap.appendChild(el('span', { class:'info' }, `Page ${page} of ${last} · ${total} entries`));
  wrap.appendChild(el('button', { class:'btn btn-secondary btn-sm', disabled: page>=last, onclick:() => onJump(page+1) }, 'Next →'));
  return wrap;
}

function crumbs(items) {
  const c = el('div', { class:'crumbs' });
  items.forEach((pair, i) => {
    const [route, label] = pair;
    if (i > 0) c.appendChild(el('span', { class:'sep' }, '›'));
    if (route !== null) c.appendChild(el('a', { href:'#/'+route }, label));
    else c.appendChild(el('span', {}, label));
  });
  return c;
}

function errorBlock(err) {
  return el('div', { class:'empty' },
    el('div', { class:'glyph' }, '⚠'),
    el('h3', {}, err.status ? 'Error '+err.status : 'Connection lost'),
    el('p', {}, err.message),

  );
}

/* ============================================================
   SPOILER RENDERING

   The backend serialises any narrative field that may carry inline
   `[spoiler ch=N]…[/spoiler]` markup as a `RenderedContent`:

     { segments: [
         { type:'text',    content:'…',   revealChapter:null },
         { type:'spoiler', content:'…',   revealChapter:N    },  // revealed
         { type:'spoiler', content:null,  revealChapter:N    },  // hidden — server stripped
       ],
       hasHiddenContent: true|false }

   Helpers:
     plainTextOf(content)   — extract a flattened string (hidden spoilers
                              become "[ch.N+ spoiler]"); good for tooltips,
                              search filters, suggestion textareas.
     hasHidden(content)     — true iff any segment is a hidden spoiler.
     renderRendered(c,p)    — append rich nodes (text + spoiler chips) to p.
                              Each `\n` becomes a <br>; `\n\n` therefore
                              renders as two <br> which is enough vertical
                              spacing for biography-style fields.
     renderedNode(c,tag,ps) — convenience: build a single element with
                              rendered children. Equivalent to
                              `const e=el(tag,ps); renderRendered(c,e); return e;`
     spoilerBanner()        — the "this field has hidden content" notice.

   The functions accept three input shapes for backwards compatibility:
     1. A RenderedContent object (current backend output).
     2. A plain string (for legacy fields not yet wrapped).
     3. null/undefined (renders nothing). */
function _segs(content) {
  if (content == null) return null;
  if (typeof content === 'string') return null;
  return content.segments || content.Segments || null;
}
function plainTextOf(content) {
  if (content == null) return '';
  if (typeof content === 'string') return content;
  const segs = _segs(content);
  if (!segs) return '';
  return segs.map(s => {
    const t = (s.type || s.Type || '').toLowerCase();
    const text = s.content ?? s.Content;
    const ch   = s.revealChapter ?? s.RevealChapter;
    if (t === 'spoiler' && (text === null || text === undefined)) return `[ch.${ch}+ spoiler]`;
    return text || '';
  }).join('');
}
function hasHidden(content) {
  if (!content || typeof content === 'string') return false;
  const flag = content.hasHiddenContent ?? content.HasHiddenContent;
  if (typeof flag === 'boolean') return flag;
  const segs = _segs(content);
  if (!segs) return false;
  return segs.some(s => (s.type || s.Type || '').toLowerCase() === 'spoiler'
    && (s.content ?? s.Content) == null);
}
function _appendText(parent, text) {
  // Each '\n' → <br>. Splitting on /\n/ keeps empty strings between
  // consecutive newlines so '\n\n' inserts two <br> for paragraph spacing.
  const lines = String(text ?? '').split(/\n/);
  lines.forEach((ln, i) => {
    if (i > 0) parent.appendChild(el('br'));
    if (ln.length) parent.appendChild(document.createTextNode(ln));
  });
}
function renderRendered(content, parent) {
  if (content == null) return;
  if (typeof content === 'string') { _appendText(parent, content); return; }
  const segs = _segs(content);
  if (!segs || !segs.length) return;
  for (const s of segs) {
    const t = (s.type || s.Type || '').toLowerCase();
    const text = s.content ?? s.Content;
    const ch = s.revealChapter ?? s.RevealChapter;
    if (t === 'spoiler' && (text === null || text === undefined || text === '')) {
      // Hidden — server stripped the content. Show a clickable chip.
      parent.appendChild(el('span', {
        class:'spoiler hidden',
        title:`Hidden until Ch. ${ch}. Update your reading chapter to reveal.`,
      }, `Ch. ${ch}+ spoiler`));
    } else if (t === 'spoiler') {
      // Revealed — text is visible. Tag with a small "ch.N" badge so the
      // reader can see what chapter the reveal lands at.
      const span = el('span', {
        class:'spoiler revealed',
        title:`Reveal at Ch. ${ch}`,
        'data-ch': String(ch ?? ''),
      });
      _appendText(span, text);
      parent.appendChild(span);
    } else {
      _appendText(parent, text);
    }
  }
}
function renderedNode(content, tag='p', props={}) {
  const node = el(tag, props);
  renderRendered(content, node);
  return node;
}
function spoilerBanner(label='This field contains revelations beyond your current reading chapter. Continue reading to unlock them.') {
  return el('div', { class:'spoiler-banner' }, label);
}

/* ============================================================
   VIEW: GENERIC PAGE DETAIL

   PageDto returns Title and ShortDescription as RenderedContent.
   For non-character entity types we then *also* fetch the
   entity-specific endpoint (e.g. /api/constellations/by-slug/{slug})
   to surface narrative fields (Description, Effect, Conditions, …)
   that PageDto alone does not carry. The list of fields per type
   lives in ENTITY_TYPES[type].narratives.
============================================================ */
async function renderPage(slug) {
  const app = $('#app');
  app.innerHTML = '<div class="loader"><div class="loader-spinner"></div></div>';
  try {
    const p = await api.get('/api/pages/' + encodeURIComponent(slug));
    const type = p.entityType || p.entity_type;
    const info = ENTITY_TYPES[type] || { glyph:'?', single:'Page' };
    if (type === 'character') return renderCharacter(slug);
    app.innerHTML = '';
    const v = el('div', { class:'view' });
    v.appendChild(crumbs([
      ['', 'Archive'],
      ['category/'+type, info.plural],
      [null, plainTextOf(p.title) || p.slug],
    ]));

    const layout = el('div', { class:'detail-layout' });
    const main = el('div', {});
    main.appendChild(detailHeader(p, info));

    // Short description (from PageDto) — RenderedContent.
    if (hasContent(p.shortDescription || p.short_description)) {
      const body = el('div', { class:'detail-body' });
      body.appendChild(el('h2', {}, 'Overview'));
      body.appendChild(renderedNode(p.shortDescription || p.short_description, 'p'));
      if (hasHidden(p.shortDescription || p.short_description)) body.appendChild(spoilerBanner());
      main.appendChild(body);
    }

    // Entity-specific narrative fields. We fire this in parallel with the
    // header render so the user sees the page header immediately while
    // the richer text loads.
    if (info.endpoint && info.narratives && info.narratives.length) {
      const placeholder = el('div', { class:'detail-body' },
        el('div', { class:'loader', style:{ minHeight:'80px' }}, el('div', { class:'loader-spinner' })));
      main.appendChild(placeholder);
      api.get(info.endpoint + '/by-slug/' + encodeURIComponent(slug))
        .then(entity => {
          const narrativeBlock = el('div', {});
          let any = false;
          for (const [key, label] of info.narratives) {
            const v = entity[key] ?? entity[key.charAt(0).toUpperCase()+key.slice(1)];
            if (!hasContent(v)) continue;
            any = true;
            const sec = el('div', { class:'detail-body' });
            sec.appendChild(el('h2', {}, label));
            sec.appendChild(renderedNode(v, 'p'));
            if (hasHidden(v)) sec.appendChild(spoilerBanner());
            narrativeBlock.appendChild(sec);
          }
          // Structural facts that aren't RenderedContent — show as a small profile block.
          const profile = entityProfile(type, entity);
          if (profile) narrativeBlock.appendChild(profile);
          placeholder.replaceWith(any || profile ? narrativeBlock : el('div', {}));
        })
        .catch(() => {
          // Entity endpoint may 404 if the spoiler gate hides the entity even
          // when the page row itself is somehow visible. Fail soft — the page
          // header is already on screen.
          placeholder.remove();
        });
    }

    main.appendChild(commentsSection(p));

    layout.appendChild(main);
    layout.appendChild(sidePanel(p));
    v.appendChild(layout);
    app.appendChild(v);
  } catch (e) { app.innerHTML = ''; app.appendChild(errorBlock(e)); }
}

// True when a value is a non-empty string OR a RenderedContent with at least
// one segment carrying text or a hidden-spoiler chip.
function hasContent(v) {
  if (v == null) return false;
  if (typeof v === 'string') return v.length > 0;
  const segs = _segs(v);
  if (!segs) return false;
  return segs.some(s => {
    const t = (s.type || s.Type || '').toLowerCase();
    const text = s.content ?? s.Content;
    return (t === 'spoiler') || (text != null && String(text).length > 0);
  });
}

// Per-entity-type structural facts (not RenderedContent) shown as a profile.
// Returns null when there's nothing useful to display.
function entityProfile(type, e) {
  const rows = [];
  const push = (k, v) => { if (v != null && v !== '') rows.push([k, v]); };
  switch (type) {
    case 'constellation':
      push('Modifier',  e.modifier ?? e.Modifier);
      push('True name', e.trueName ?? e.TrueName);
      push('Grade',     e.grade ?? e.Grade);
      break;
    case 'dokkaebi':
      push('Channel', e.channelId ?? e.channel_id ?? e.ChannelId);
      push('Rank',    e.rank ?? e.Rank);
      break;
    case 'item':
      push('Grade',         e.itemGrade ?? e.item_grade ?? e.Grade);
      push('Star relic',    (e.isStarRelic ?? e.is_star_relic ?? e.IsStarRelic) ? 'Yes' : null);
      break;
    case 'skill':
      push('Type',          e.skillType ?? e.skill_type ?? e.SkillType);
      push('Cost (coins)',  e.costInCoins ?? e.cost_in_coins ?? e.CostInCoins);
      push('Max level',     e.maxLevel ?? e.max_level ?? e.MaxLevel);
      break;
    case 'attribute':
      push('Rarity', e.rarity ?? e.Rarity);
      break;
    case 'stigma':
      push('Activation cost', e.activationCost ?? e.activation_cost ?? e.ActivationCost);
      break;
    case 'scenario':
      push('Code',       e.code ?? e.Code);
      push('Type',       e.type ?? e.Type);
      push('Difficulty', e.difficulty ?? e.Difficulty);
      push('Chapters',   ((e.chapterStart ?? e.chapter_start) ?? '?') + '–' + ((e.chapterEnd ?? e.chapter_end) ?? '?'));
      break;
    case 'arc':
      push('Order',    e.orderNumber ?? e.order_number ?? e.OrderNumber);
      push('Chapters', ((e.chapterStart ?? e.chapter_start) ?? '?') + '–' + ((e.chapterEnd ?? e.chapter_end) ?? '?'));
      break;
    case 'location':
      push('Dimension', e.dimension ?? e.Dimension);
      break;
    case 'worldline':
      push('Line number', e.lineNumber ?? e.line_number ?? e.LineNumber);
      push('Main',        (e.isMain ?? e.is_main ?? e.IsMain) ? 'Yes' : null);
      break;
    case 'event':
      push('Chapter',    e.chapterNumber ?? e.chapter_number ?? e.ChapterNumber);
      push('Importance', e.importance ?? e.Importance);
      break;
    case 'concept':
      push('Impact', e.impactLevel ?? e.impact_level ?? e.ImpactLevel);
      break;
  }
  if (!rows.length) return null;
  const card = el('div', { class:'detail-body' });
  card.appendChild(el('h2', {}, 'Profile'));
  for (const [k, v] of rows) {
    card.appendChild(el('div', { class:'field-row' },
      el('div', { class:'field-label' }, k),
      el('div', { class:'field-value' }, String(v)),
    ));
  }
  return card;
}

function detailHeader(p, info) {
  const titleNode = el('h1', {}); renderRendered(p.title, titleNode);
  const summary = p.shortDescription || p.short_description;
  return el('div', { class:'detail-header' },
    el('div', { class:'type' }, info.glyph + '  ' + info.single),
    titleNode,
    hasContent(summary) ? renderedNode(summary, 'div', { class:'summary' }) : null,
    el('div', { class:'meta-row' },
      el('span', {}, '📖 First seen: ', el('strong', {}, 'Ch. '+ (p.discoveryChapter ?? p.discovery_chapter))),
      el('span', {}, '👁 ', el('strong', {}, (p.viewCount ?? p.view_count ?? 0).toLocaleString()), ' views'),
      el('span', {}, '🜲 ', el('strong', {}, '/' + p.slug)),
    ),
  );
}

/* ============================================================
   VIEW: CHARACTER DETAIL
   CharacterDto carries Title and ShortDescription as RenderedContent
   (page-derived) plus its own narrative field Biography. The structural
   columns (FullName, Alias, Species, Status, Gender, BirthChapter,
   DeathChapter) are passthrough and are shown as a small profile card.
============================================================ */
async function renderCharacter(slug) {
  const app = $('#app');
  app.innerHTML = '<div class="loader"><div class="loader-spinner"></div></div>';
  try {
    const c = await api.get('/api/characters/by-slug/' + encodeURIComponent(slug));
    const info = ENTITY_TYPES.character;
    const fullName = c.fullName || c.full_name;
    const discoveryCh = c.discoveryChapter ?? c.discovery_chapter;
    const pageId  = c.pageId ?? c.page_id;
    // Synthesize a Page-shaped object so comments + sidePanel keep working
    // without needing the entity to also include a nested .page.
    const pageData = {
      id: pageId, slug, title: fullName, entityType:'character',
      shortDescription: c.shortDescription ?? c.short_description,
      discoveryChapter: discoveryCh,
    };
    app.innerHTML = '';
    const v = el('div', { class:'view' });
    v.appendChild(crumbs([['', 'Archive'], ['category/character', 'Characters'], [null, fullName]]));

    const layout = el('div', { class:'detail-layout' });
    const main = el('div', {});

    const summary = c.shortDescription ?? c.short_description;
    main.appendChild(el('div', { class:'detail-header' },
      el('div', { class:'type' }, info.glyph + '  Character' + (c.alias ? ' · ' + c.alias : '')),
      el('h1', {}, fullName),
      hasContent(summary)
        ? renderedNode(summary, 'div', { class:'summary' })
        : el('div', { class:'summary' }, c.species ? `${cap(c.species)} · ${cap(c.status||c.Status||'unknown')}` : cap(c.status||c.Status||'unknown')),
      el('div', { class:'meta-row' },
        (c.birthChapter ?? c.birth_chapter) ? el('span', {}, '◐ Born: ', el('strong', {}, 'Ch. '+(c.birthChapter ?? c.birth_chapter))) : null,
        (c.deathChapter ?? c.death_chapter) ? el('span', {}, '☠ Died: ', el('strong', {}, 'Ch. '+(c.deathChapter ?? c.death_chapter))) : null,
        c.gender ? el('span', {}, '⚥ ', el('strong', {}, cap(c.gender))) : null,
        discoveryCh != null ? el('span', {}, '📖 First seen: ', el('strong', {}, 'Ch. '+discoveryCh)) : null,
      ),
    ));

    // Biography (RenderedContent — may carry inline spoilers).
    const bio = c.biography ?? c.Biography;
    if (hasContent(bio)) {
      const body = el('div', { class:'detail-body' });
      body.appendChild(el('h2', {}, 'Biography'));
      body.appendChild(renderedNode(bio, 'p'));
      if (hasHidden(bio)) body.appendChild(spoilerBanner(
        '✦ This biography contains revelations beyond your current reading chapter. Continue reading to unlock them.'));
      main.appendChild(body);
    }

    // Profile (structural fields)
    const fields = [
      ['Alias', c.alias],
      ['Species', c.species && cap(c.species)],
      ['Status', c.status && cap(c.status)],
      ['Gender', c.gender && cap(c.gender)],
    ].filter(f => f[1]);
    if (fields.length) {
      const body = el('div', { class:'detail-body' });
      body.appendChild(el('h2', {}, 'Profile'));
      for (const [k, val] of fields) {
        body.appendChild(el('div', { class:'field-row' },
          el('div', { class:'field-label' }, k),
          el('div', { class:'field-value' }, val),
        ));
      }
      main.appendChild(body);
    }

    if (pageId) main.appendChild(commentsSection(pageData));

    layout.appendChild(main);
    layout.appendChild(sidePanel(pageData));
    v.appendChild(layout);
    app.appendChild(v);
  } catch (e) { app.innerHTML = ''; app.appendChild(errorBlock(e)); }
}
function cap(s) { return s ? String(s)[0].toUpperCase()+String(s).slice(1) : ''; }

/* ============================================================
   COMMENTS
============================================================ */
function commentsSection(p) {
  const wrap = el('div', { class:'detail-body', id:'comments-block' });
  wrap.appendChild(el('h2', {}, '✦ Reader Discourse'));
  wrap.appendChild(el('p', { style:{ color:'var(--text-3)', fontSize:'.85rem', marginTop:'-.4rem', marginBottom:'1rem' }},
    'Only comments posted by readers at or below your current chapter are shown.'));

  if (State.user) {
    const ta = el('textarea', { placeholder:'Add to the discourse… (be mindful of spoilers — your comment will only show to readers who have reached your current chapter)' });
    const submit = async () => {
      if (!ta.value.trim()) return;
      try {
        await api.post('/api/comments', { pageId: p.id, body: ta.value.trim() });
        ta.value = '';
        loadComments();
      } catch (e) { toast(e.message, 'error'); }
    };
    wrap.appendChild(el('div', { class:'comment-form' },
      ta,
      el('div', { class:'comment-form-actions' },
        el('button', { class:'btn btn-primary btn-sm', onclick:submit }, 'Post'),
      ),
    ));
  } else {
    wrap.appendChild(el('div', { class:'side-card', style:{ background:'var(--space)', textAlign:'center' }},
      el('p', { style:{ marginBottom:'.6rem' }}, 'Sign in to participate in the discourse.'),
      el('button', { class:'btn btn-primary btn-sm', onclick:() => openAuth('login') }, 'Sign in')));
  }

  const list = el('div', { class:'comment-thread' });
  wrap.appendChild(list);

  async function loadComments() {
    list.innerHTML = '<div class="loader"><div class="loader-spinner"></div></div>';
    try {
      const r = await api.get('/api/comments?pageId=' + p.id);
      const items = r?.items || r || [];
      list.innerHTML = '';
      if (!items.length) {
        list.appendChild(el('div', { class:'empty' },
          el('div', { class:'glyph' }, '✧'),
          el('p', {}, 'The discourse is silent. Be the first.'),
        ));
        return;
      }
      // Build tree
      const byId = {}; items.forEach(c => { c._kids = []; byId[c.id] = c; });
      const roots = [];
      items.forEach(c => {
        const pid = c.parentCommentId ?? c.parent_comment_id;
        if (pid && byId[pid]) byId[pid]._kids.push(c);
        else roots.push(c);
      });
      roots.forEach(c => list.appendChild(commentNode(c, p)));
    } catch (e) {
      list.innerHTML = '';
      list.appendChild(errorBlock(e));
    }
  }
  loadComments();
  wrap.dataset.refresh = 'comments';
  return wrap;
}

function commentNode(c, p) {
  const node = el('div', { class:'comment' });
  const ch = c.chapterAtPost ?? c.chapter_at_post;
  const deleted = c.isDeleted ?? c.is_deleted;
  node.appendChild(el('div', { class:'comment-head' },
    el('span', { class:'author' }, c.username || (deleted ? '[deleted]' : 'reader')),
    ch !== undefined ? el('span', { class:'ch-tag' }, 'Ch. '+ch) : null,
    el('span', { class:'ago' }, fmtDate(c.createdAt || c.created_at)),
  ));
  node.appendChild(el('div', { class:'comment-body'+(deleted ? ' deleted' : '') }, deleted ? '[comment removed]' : (c.body || '')));

  if (!deleted) {
    const acts = el('div', { class:'comment-actions' });
    // Reactions
    const reactions = c.reactions || c.Reactions || [];
    for (const rx of REACTIONS) {
      const summary = reactions.find(s => (s.type || s.Type) === rx.type) || { count: 0, byMe: false };
      const myReacted = summary.byMe ?? summary.ByMe ?? false;
      const btn = el('button', {
        class:'react-btn'+(myReacted ? ' active' : ''),
        onclick:async () => {
          if (!State.user) return openAuth('login');
          try {
            await api.post(`/api/comments/${c.id}/reactions/${rx.type}`);
            // Optimistic refresh of this comment block
            const block = node.closest('[data-refresh="comments"]');
            if (block) {
              // re-fetch from API
              const list = block.querySelector('.comment-thread');
              const evt = new Event('refresh');
              // simpler — reload entire comments by triggering parent
              const allComments = await api.get('/api/comments?pageId='+p.id);
              const items = allComments?.items || allComments || [];
              const updated = items.find(x => x.id === c.id);
              if (updated) {
                const newNode = commentNode({ ...updated, _kids: c._kids }, p);
                node.replaceWith(newNode);
              }
            }
          } catch (e) { toast(e.message, 'error'); }
        },
      }, rx.emoji, summary.count > 0 ? el('span', { class:'count' }, summary.count) : null);
      acts.appendChild(btn);
    }
    // Reply
    if (State.user) {
      acts.appendChild(el('button', { class:'react-btn', onclick:() => openReply(c, p, node) }, '↳ Reply'));
      const isMine = State.user.id == c.userId || State.user.username === c.username;
      if (isMine || State.user.role === 'editor' || State.user.role === 'admin') {
        acts.appendChild(el('button', { class:'react-btn', onclick:async () => {
          if (!confirm('Delete this comment?')) return;
          try { await api.del('/api/comments/'+c.id); node.querySelector('.comment-body').textContent = '[comment removed]'; node.querySelector('.comment-body').classList.add('deleted'); acts.remove(); }
          catch (e) { toast(e.message, 'error'); }
        }}, '✕ Delete'));
      }
    }
    node.appendChild(acts);
  }

  if (c._kids && c._kids.length) {
    const kids = el('div', { class:'comment-children' });
    c._kids.forEach(k => kids.appendChild(commentNode(k, p)));
    node.appendChild(kids);
  }
  return node;
}

function openReply(parent, page, parentNode) {
  const ta = el('textarea', { placeholder:'Reply…', autofocus:true });
  const form = el('div', { class:'comment-form', style:{ marginTop:'.6rem' }},
    ta,
    el('div', { class:'comment-form-actions' },
      el('button', { class:'btn btn-ghost btn-sm', onclick:() => form.remove() }, 'Cancel'),
      el('button', { class:'btn btn-primary btn-sm', onclick:async () => {
        if (!ta.value.trim()) return;
        try {
          await api.post('/api/comments', { pageId: page.id, body: ta.value.trim(), parentCommentId: parent.id });
          form.remove();
          // Reload thread
          const block = parentNode.closest('[data-refresh="comments"]');
          if (block) {
            const all = await api.get('/api/comments?pageId='+page.id);
            const items = all?.items || all || [];
            const list = block.querySelector('.comment-thread');
            list.innerHTML = '';
            const byId = {}; items.forEach(c => { c._kids = []; byId[c.id] = c; });
            const roots = [];
            items.forEach(c => { const pid = c.parentCommentId ?? c.parent_comment_id; if (pid && byId[pid]) byId[pid]._kids.push(c); else roots.push(c); });
            roots.forEach(c => list.appendChild(commentNode(c, page)));
          }
        } catch (e) { toast(e.message, 'error'); }
      }}, 'Post reply'),
    ),
  );
  parentNode.appendChild(form);
}

/* ============================================================
   EDIT SUGGEST
============================================================ */
function openSuggest(p) {
  if (!State.user) return openAuth('login');
  openModal(close => {
    // The page-level Title and ShortDescription come back as RenderedContent
    // when fetched from /api/pages/{slug}. The edit-suggestion endpoint
    // expects plain strings (the editor types raw `[spoiler ch=N]…[/spoiler]`
    // markup themselves), so we flatten via plainTextOf for the prefilled
    // values — including the hidden-segment placeholder so the editor knows
    // there is content there they can't see and need to preserve.
    const initialTitle = plainTextOf(p.title);
    const initialDesc  = plainTextOf(p.shortDescription || p.short_description);
    const titleIn = el('input', { type:'text', value: initialTitle, placeholder:'New title (optional)' });
    const descIn  = el('textarea', { placeholder:'New short description (optional)' });
    descIn.value = initialDesc;
    const chIn    = el('input', { type:'number', min:'1', value: p.discoveryChapter ?? p.discovery_chapter });
    const reasonIn= el('textarea', { placeholder:'Reason / source (optional)' });
    return el('div', { class:'modal-content' },
      el('h2', {}, 'Suggest an Edit'),
      el('div', { class:'modal-sub' }, 'Editors will review your proposal. Page-level fields (title, summary, discovery chapter) can be auto-applied.'),
      el('div', { class:'field' }, el('label', {}, 'Title'), titleIn),
      el('div', { class:'field' },
        el('label', {}, 'Short description'),
        descIn,
        el('div', { style:{ fontSize:'.78rem', color:'var(--text-3)', marginTop:'.3rem' }},
          'Use ', el('code', {}, '[spoiler ch=N]…[/spoiler]'), ' to hide passages until reading chapter N.'),
      ),
      el('div', { class:'field' }, el('label', {}, 'Discovery chapter'), chIn),
      el('div', { class:'field' }, el('label', {}, 'Reason'), reasonIn),
      el('div', { class:'modal-actions' },
        el('button', { class:'btn btn-ghost', onclick:close }, 'Cancel'),
        el('button', { class:'btn btn-primary', onclick:async () => {
          const changes = {};
          if (titleIn.value && titleIn.value !== initialTitle) changes.title = titleIn.value;
          if (descIn.value !== initialDesc) changes.shortDescription = descIn.value;
          const newCh = parseInt(chIn.value);
          if (newCh && newCh !== (p.discoveryChapter ?? p.discovery_chapter)) changes.discoveryChapter = newCh;
          if (Object.keys(changes).length === 0) { toast('No changes detected', 'error'); return; }
          try {
            await api.post('/api/edit-suggestions', {
              pageId: p.id,
              proposedChanges: changes,
              reason: reasonIn.value.trim() || null,
            });
            toast('Suggestion submitted — thank you', 'success');
            close();
          } catch (e) { toast(e.message, 'error'); }
        }}, 'Submit'),
      ),
    );

    const status = (s.status || s.Status || 'pending').toLowerCase();

      el('div', { style:{ display:'flex', justifyContent:'space-between', alignItems:'flex-start', flexWrap:'wrap', gap:'.6rem' }},

          el('h4', { style:{ marginBottom:'.2rem' }}, s.pageTitle || s.PageTitle || ('Page #' + (s.pageId ?? s.page_id))),

            (s.username ? ' by ' + s.username : ''),

      ),
      s.reason ? el('p', { style:{ marginTop:'.6rem', fontStyle:'italic', color:'var(--text-2)' }}, '"' + s.reason + '"') : null,
      el('pre', { style:{ marginTop:'.6rem', padding:'.6rem .8rem', background:'var(--space)', borderRadius:'5px', fontSize:'.8rem', overflowX:'auto', color:'var(--cyan)', border:'1px solid var(--border)' }},
        JSON.stringify(s.proposedChanges || s.proposed_changes || {}, null, 2)),
      asReviewer && status === 'pending' ? el('div', { style:{ marginTop:'.8rem', display:'flex', gap:'.4rem' }},

          try { await api.post('/api/edit-suggestions/'+s.id+'/approve'); toast('Approved', 'success'); renderQueue(); }
          catch (e) { toast(e.message, 'error'); }

async function renderTimeline() {
  const app = $('#app');
  app.innerHTML = '';
  const v = el('div', { class:'view' });
  v.appendChild(crumbs([['', 'Archive'], [null, 'Timeline']]));
  v.appendChild(el('div', { class:'detail-header' },
    el('div', { class:'type' }, '∞  3D Timeline'),
    el('h1', {}, 'The Worldlines'),
    el('div', { class:'summary' }, 'Parallel regression chains plotted against story chapter, with cross-line connections. ⚠ The timeline is inherently spoiler-rich. Use the chapter cap below to self-impose limits.'),
  ));

  const chapCapIn = el('input', { type:'number', placeholder:'all', min:'1', style:{ width:'90px' }, value: State.user?.currentChapter ?? '' });
  const charIdIn  = el('input', { type:'number', placeholder:'(optional)', min:'1', style:{ width:'120px' }});
  const reload = () => loadAndRender();
  v.appendChild(el('div', { class:'timeline-controls' },
    el('label', {}, 'Chapter cap'), chapCapIn,
    el('label', { style:{ marginLeft:'.6rem' }}, 'Filter by character ID'), charIdIn,
    el('button', { class:'btn btn-secondary btn-sm', onclick:reload }, 'Apply'),
    el('button', { class:'btn btn-ghost btn-sm', onclick:() => { chapCapIn.value=''; charIdIn.value=''; reload(); }}, 'Reset'),
  ));

  const canvasWrap = el('div', { class:'timeline-canvas', id:'tl-canvas' });
  const legend = el('div', { class:'tl-legend' },
    el('span', { class:'tl-legend-item' }, el('span', { class:'tl-legend-swatch', style:{ background:'var(--gold)' }}), 'Regression'),
    el('span', { class:'tl-legend-item' }, el('span', { class:'tl-legend-swatch', style:{ background:'var(--purple)' }}), 'Migration'),
    el('span', { class:'tl-legend-item' }, el('span', { class:'tl-legend-swatch', style:{ background:'var(--cyan)' }}), 'Causality'),
    el('span', { class:'tl-legend-item' }, el('span', { class:'tl-legend-swatch', style:{ background:'var(--crimson)' }}), 'Prophecy'),
    el('span', { class:'tl-legend-item' }, el('span', { class:'tl-legend-swatch', style:{ background:'var(--text-3)' }}), 'Parallel'),
    el('span', { class:'tl-legend-item' }, el('span', { style:{ display:'inline-block', width:10, height:10, borderRadius:'50%', background:'var(--gold-bright)', boxShadow:'0 0 6px var(--gold-glow)' }}), 'Pivotal event'),
    el('span', { class:'tl-legend-item' }, el('span', { style:{ display:'inline-block', width:8, height:8, borderRadius:'50%', background:'var(--gold)' }}), 'Major event'),
  );
  v.appendChild(canvasWrap);
  v.appendChild(legend);
  app.appendChild(v);

  async function loadAndRender() {
    canvasWrap.innerHTML = '<div class="loader"><div class="loader-spinner"></div></div>';
    let qs = [];
    if (chapCapIn.value) qs.push('upToChapter='+parseInt(chapCapIn.value));
    if (charIdIn.value) qs.push('characterId='+parseInt(charIdIn.value));
    const url = '/api/timeline' + (qs.length ? '?' + qs.join('&') : '');
    try {
      const data = await api.get(url);
      drawTimeline(canvasWrap, data);
    } catch (e) { canvasWrap.innerHTML = ''; canvasWrap.appendChild(errorBlock(e)); }
  }
  loadAndRender();
}

function drawTimeline(host, data) {
  const worldlines = data?.worldlines || data?.Worldlines || [];
  const events     = data?.events     || data?.Events     || [];
  const conns      = data?.connections|| data?.Connections|| [];

  if (worldlines.length === 0 && events.length === 0) {
    host.innerHTML = '';
    host.appendChild(el('div', { class:'empty' }, el('div', { class:'glyph' }, '∞'), el('h3', {}, 'No timeline data yet'), el('p', {}, 'Once events are connected to worldlines, this view comes alive.')));
    return;
  }

  // Normalize
  const wls = worldlines.map(w => ({
    id: w.id ?? w.Id,
    line: w.lineNumber ?? w.line_number ?? w.LineNumber ?? 0,
    name: w.name ?? w.Name ?? null,
    isMain: w.isMain ?? w.is_main ?? w.IsMain ?? false,
  }));
  // Sort by lineNumber, with line 0 at the start, then ascending
  wls.sort((a,b) => a.line - b.line);
  const evs = events.map(e => ({
    id: e.id ?? e.Id,
    title: e.title ?? e.Title ?? '',
    chapter: e.chapterNumber ?? e.chapter_number ?? e.ChapterNumber ?? 1,
    worldlineId: e.worldlineId ?? e.worldline_id ?? e.WorldlineId,
    importance: (e.importance ?? e.Importance ?? 'minor').toLowerCase(),
  }));
  const cns = conns.map(c => ({
    src: c.sourceEventId ?? c.source_event_id ?? c.SourceEventId,
    tgt: c.targetEventId ?? c.target_event_id ?? c.TargetEventId,
    type:(c.connectionType ?? c.connection_type ?? c.ConnectionType ?? 'parallel').toLowerCase(),
  }));

  // Add a synthetic lane for events without a worldline
  const ORPHAN_ID = '__orphan__';
  if (evs.some(e => !e.worldlineId)) {
    wls.push({ id: ORPHAN_ID, line: '?', name: 'Unassigned', isMain:false });
  }

  // Layout
  const laneW = 220;
  const padTop = 80, padBot = 60, padLeft = 80, padRight = 40;
  const minChap = Math.min(1, ...evs.map(e => e.chapter));
  const maxChap = Math.max(50, ...evs.map(e => e.chapter));
  const chapRange = Math.max(1, maxChap - minChap);
  const heightPerChapter = 6;
  const innerH = Math.max(420, chapRange * heightPerChapter);
  const totalH = innerH + padTop + padBot;
  const totalW = padLeft + wls.length * laneW + padRight;

  const laneX = id => {
    const i = wls.findIndex(w => w.id === id);
    return padLeft + (i + 0.5) * laneW;
  };
  const yFor = ch => padTop + ((ch - minChap) / chapRange) * innerH;

  host.innerHTML = '';
  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.setAttribute('class', 'timeline-svg');
  svg.setAttribute('width', totalW);
  svg.setAttribute('height', totalH);
  svg.setAttribute('viewBox', `0 0 ${totalW} ${totalH}`);

  // Chapter axis
  const tickEvery = chapRange > 800 ? 100 : chapRange > 400 ? 50 : chapRange > 100 ? 25 : chapRange > 30 ? 10 : 5;
  for (let c = Math.ceil(minChap/tickEvery)*tickEvery; c <= maxChap; c += tickEvery) {
    const y = yFor(c);
    const ln = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    ln.setAttribute('x1', padLeft - 30); ln.setAttribute('x2', totalW - padRight + 10);
    ln.setAttribute('y1', y); ln.setAttribute('y2', y);
    ln.setAttribute('stroke', '#1a1f3a'); ln.setAttribute('stroke-width', 1);
    svg.appendChild(ln);
    const t = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    t.setAttribute('x', padLeft - 36); t.setAttribute('y', y+3);
    t.setAttribute('class', 'tl-axis-label'); t.setAttribute('text-anchor', 'end');
    t.textContent = 'Ch ' + c;
    svg.appendChild(t);
  }

  // Lane lines and headers
  wls.forEach(w => {
    const x = laneX(w.id);
    const ln = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    ln.setAttribute('x1', x); ln.setAttribute('x2', x);
    ln.setAttribute('y1', padTop - 20); ln.setAttribute('y2', totalH - padBot + 10);
    ln.setAttribute('class', 'tl-lane-line');
    if (w.isMain) ln.setAttribute('stroke', '#3d4670');
    svg.appendChild(ln);
    const head = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    head.setAttribute('x', x); head.setAttribute('y', 28);
    head.setAttribute('class', 'tl-lane-header'); head.setAttribute('text-anchor', 'middle');
    head.textContent = w.line === '?' ? 'Unassigned' : ('Worldline ' + w.line + (w.isMain ? ' ★' : ''));
    svg.appendChild(head);
    if (w.name && w.name !== ('Worldline '+w.line)) {
      const sub = document.createElementNS('http://www.w3.org/2000/svg', 'text');
      sub.setAttribute('x', x); sub.setAttribute('y', 46);
      sub.setAttribute('class', 'tl-axis-label'); sub.setAttribute('text-anchor', 'middle');
      sub.textContent = w.name.length > 22 ? w.name.slice(0, 22) + '…' : w.name;
      svg.appendChild(sub);
    }
  });

  // Connections (curves between events on possibly different lanes)
  const eventById = {}; evs.forEach(e => { eventById[e.id] = e; });
  cns.forEach(c => {
    const s = eventById[c.src], t = eventById[c.tgt];
    if (!s || !t) return;
    const x1 = laneX(s.worldlineId || ORPHAN_ID), y1 = yFor(s.chapter);
    const x2 = laneX(t.worldlineId || ORPHAN_ID), y2 = yFor(t.chapter);
    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    const cx = (x1 + x2) / 2 + (x2 > x1 ? 30 : -30);
    const cy = (y1 + y2) / 2;
    const d = `M ${x1} ${y1} Q ${cx} ${cy} ${x2} ${y2}`;
    path.setAttribute('d', d);
    path.setAttribute('class', 'tl-conn ' + c.type);
    svg.appendChild(path);
    // Arrowhead via small circle
    const tip = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    tip.setAttribute('cx', x2); tip.setAttribute('cy', y2);
    tip.setAttribute('r', 2.5);
    tip.setAttribute('fill', c.type === 'regression' ? 'var(--gold)' : c.type === 'causality' ? 'var(--cyan)' : c.type === 'prophecy' ? 'var(--crimson)' : 'var(--purple)');
    svg.appendChild(tip);
  });

  // Events
  evs.forEach(e => {
    const x = laneX(e.worldlineId || ORPHAN_ID), y = yFor(e.chapter);
    const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    g.setAttribute('class', 'tl-event ' + e.importance);
    g.setAttribute('transform', `translate(${x},${y})`);
    const r = e.importance === 'pivotal' ? 7 : e.importance === 'major' ? 6 : 4.5;
    const c1 = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    c1.setAttribute('r', r);
    g.appendChild(c1);
    const lbl = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    lbl.setAttribute('class', 'tl-event-label');
    lbl.setAttribute('x', 12); lbl.setAttribute('y', 4);
    lbl.textContent = e.title.length > 26 ? e.title.slice(0, 26) + '…' : e.title;
    g.appendChild(lbl);
    g.addEventListener('mouseenter', ev => showTooltip(ev, e));
    g.addEventListener('mouseleave', hideTooltip);
    g.addEventListener('mousemove', ev => moveTooltip(ev));
    svg.appendChild(g);
  });

  host.appendChild(svg);
}

let _tooltipEl = null;
function showTooltip(ev, e) {
  hideTooltip();
  const root = $('#tooltip-root');
  _tooltipEl = el('div', { class:'tooltip' },
    el('h5', {}, e.title),
    el('div', { class:'meta' }, `Ch. ${e.chapter} · ${e.importance}`),
  );
  root.appendChild(_tooltipEl);
  moveTooltip(ev);
}
function moveTooltip(ev) {
  if (!_tooltipEl) return;
  const x = ev.clientX + 14, y = ev.clientY + 14;
  _tooltipEl.style.left = x + 'px';
  _tooltipEl.style.top  = y + 'px';
  _tooltipEl.style.position = 'fixed';
}
function hideTooltip() { if (_tooltipEl) { _tooltipEl.remove(); _tooltipEl = null; } }

async function openNotifDrawer() {
  const root = $('#drawer-root');
  root.innerHTML = '';
  const overlay = el('div', { class:'drawer-overlay', onclick:() => root.innerHTML = '' });
  const drawer  = el('div', { class:'drawer' });

    el('h3', {}, '🔔 Notifications'),
    el('button', { class:'btn btn-ghost btn-sm', onclick:async () => {
      try { await api.post('/api/notifications/read-all'); refreshUnread(); openNotifDrawer(); }
      catch (e) { toast(e.message, 'error'); }
    }}, 'Mark all read'),
  );
  const body = el('div', { class:'drawer-body' });
  drawer.appendChild(head); drawer.appendChild(body);
  root.appendChild(overlay); root.appendChild(drawer);

  body.innerHTML = '<div class="loader"><div class="loader-spinner"></div></div>';
  try {
    const r = await api.get('/api/notifications?page=1&pageSize=30');
    const items = r?.items || r || [];
    body.innerHTML = '';
    if (!items.length) {
      body.appendChild(el('div', { class:'empty' }, el('div', { class:'glyph' }, '🔕'), el('p', {}, 'No notifications yet.')));
      return;
    }
    items.forEach(n => {
      const isRead = n.isRead ?? n.is_read;
      const it = el('div', { class:'notif-item'+(!isRead ? ' unread' : ''), onclick:async () => {
        if (!isRead) {
          try { await api.post('/api/notifications/'+n.id+'/read'); it.classList.remove('unread'); refreshUnread(); } catch {}
        }
      }});
      it.appendChild(el('div', { class:'type' }, (n.type || n.Type || 'system').replace(/_/g, ' ')));
      const payload = n.payload || n.Payload || {};
      const text = payload.message || payload.body || payload.title || JSON.stringify(payload);
      it.appendChild(el('div', { class:'body' }, text));
      it.appendChild(el('div', { class:'time' }, fmtDate(n.createdAt || n.created_at)));
      body.appendChild(it);
    });
  } catch (e) { body.innerHTML = ''; body.appendChild(errorBlock(e)); }
}

$('#searchInput').addEventListener('input', e => {

async function searchRun(q, rEl) {
  rEl.innerHTML = '<div class="search-results"><div style="padding:.6rem .8rem;color:var(--text-3)">Searching…</div></div>';
  try {
    // The backend doesn't expose a search endpoint per docs; we approximate by listing pages and
    // filtering client-side. Real prod would have /api/pages?search=...
    // Title and ShortDescription come back as RenderedContent — we flatten via
    // plainTextOf so the substring match also peeks through revealed spoilers
    // without leaking hidden-segment placeholders.
    const r = await api.get('/api/pages?page=1&pageSize=50');
    const ql = q.toLowerCase();
    const items = (r?.items || r || []).filter(p => {
      const title = plainTextOf(p.title).toLowerCase();
      const desc  = plainTextOf(p.shortDescription || p.short_description).toLowerCase();
      return title.includes(ql) || (p.slug || '').toLowerCase().includes(ql) || desc.includes(ql);
    }).slice(0, 10);
    rEl.innerHTML = '';
    if (!items.length) {
      rEl.appendChild(el('div', { class:'search-results' }, el('div', { style:{ padding:'.6rem .8rem', color:'var(--text-3)' }}, 'No matches in visible pages.')));
      return;
    }
    const wrap = el('div', { class:'search-results' });
    items.forEach(p => {
      const type = p.entityType || p.entity_type;
      const info = ENTITY_TYPES[type] || { glyph:'?', single:'Page' };
      const route = type === 'character' ? 'character/'+p.slug : 'page/'+p.slug;
      const titleNode = el('div', {}); renderRendered(p.title, titleNode);
      wrap.appendChild(el('div', { class:'search-result', onmousedown:() => { navigate(route); $('#searchInput').value=''; rEl.innerHTML=''; }},
        el('span', { style:{ color:'var(--gold)', fontSize:'1.1rem' }}, info.glyph),
        el('div', {},
          titleNode,
          el('div', { class:'meta' }, info.single + ' · Ch. ' + (p.discoveryChapter ?? p.discovery_chapter)),
        ),
      ));
    });
    rEl.appendChild(wrap);
  } catch (e) {
    rEl.innerHTML = '';
    rEl.appendChild(el('div', { class:'search-results' }, el('div', { style:{ padding:'.6rem .8rem', color:'var(--danger)' }}, e.message)));
  }
}
