<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ORV Wiki — The Star Stream Archive</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<canvas id="starfield"></canvas>

<header class="site">
  <nav class="nav">
    <div class="brand" data-route="">
      <span class="brand-mark"></span>
      <div>ORV Wiki<span class="brand-tag">★ The Star Stream Archive</span></div>
    </div>

    <div class="menubar" id="menubar"></div>

    <div class="search-wrap">
      <span class="search-icon">⌕</span>
      <input class="search-input" type="text" id="searchInput" placeholder="Search the archive…" autocomplete="off">
      <div id="searchResults"></div>
    </div>

    <div class="chapter-pill" id="chapterPill" title="Click to update reading progress">
      <span>📖</span><span id="chapterPillText">Ch. —</span>
    </div>

    <button class="btn btn-ghost notif-btn" id="notifBtn" title="Notifications" style="display:none">
      <span style="font-size:1.1rem">🔔</span>
      <span class="notif-dot" id="notifDot" style="display:none"></span>
    </button>

    <div id="userArea"></div>
  </nav>
</header>

<main class="app" id="app"></main>

<div id="modal-root"></div>
<div id="toast-root"></div>
<div id="drawer-root"></div>
<div id="tooltip-root"></div>

<!--
  Script load order matters because these are plain <script> tags, not ES
  modules. Each file declares globals (functions, const State, api, …) that
  later files reference. Order:
    core           — State, ENTITY_TYPES, api, $, el, toast, openModal
    spoiler        — plainTextOf, hasContent, hasHidden, renderRendered,
                     renderedNode, spoilerBanner (used by views, comments,
                     views-user, notifications)
    chrome         — startStarfield, buildMenubar (uses ENTITY_TYPES, navigate)
    auth           — renderUserArea, openAuth, openChapterModal, openSettings
    router         — navigate, renderRoute (referenced by everything above)
    views          — renderHome, renderCategory, renderPage, renderCharacter,
                     pageCard, errorBlock, crumbs
    comments       — commentsSection, openSuggest
    views-user     — renderBookmarks, renderMySuggestions, renderQueue,
                     renderTimeline
    notifications  — wires up #notifBtn, #chapterPill, #searchInput at parse
                     time — must run after the elements above exist
    init           — kicks everything off; must be last
-->
<script src="js/core.js"></script>
<script src="js/spoiler.js"></script>
<script src="js/chrome.js"></script>
<script src="js/auth.js"></script>
<script src="js/router.js"></script>
<script src="js/views.js"></script>
<script src="js/comments.js"></script>
<script src="js/views-user.js"></script>
<script src="js/notifications.js"></script>
<script src="js/init.js"></script>
</body>
</html>
