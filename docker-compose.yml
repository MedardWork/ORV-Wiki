# Full ORV Wiki stack: Postgres + .NET API + Nginx-served static frontend.
#
# Usage:
#   docker compose up --build
# Then open http://localhost:8080
#
# The frontend container also reverse-proxies /api/* and /hubs/* to the API,
# so the browser only ever talks to one origin — no CORS issues, no need to
# memorize two ports.

services:
  db:
    image: postgres:16-alpine
    container_name: orv-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-orv_wiki}
      POSTGRES_USER: ${POSTGRES_USER:-orv}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-orv}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Exposed on the host so you can connect Rider/DBeaver/psql directly.
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-orv} -d ${POSTGRES_DB:-orv_wiki}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: ORVWiki.API/Dockerfile
    container_name: orv-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Development mode runs migrations + seed, enables OpenAPI/Scalar, and
      # relaxes CORS — exactly what we want for the local stack.
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Postgres: "Host=db;Port=5432;Database=${POSTGRES_DB:-orv_wiki};Username=${POSTGRES_USER:-orv};Password=${POSTGRES_PASSWORD:-orv}"
      Jwt__Issuer: orv-wiki
      Jwt__Audience: orv-wiki-clients
      Jwt__SigningKey: ${JWT_SIGNING_KEY:-REPLACE_WITH_AT_LEAST_32_CHARS_LONG_SECRET_KEY_FOR_HMAC_SHA256}
      Jwt__AccessTokenMinutes: "60"
    ports:
      # Exposed for direct API access (Scalar UI, curl), but the frontend
      # talks to it through the internal docker network. Host port is 5080
      # because macOS Control Center grabs :5000 (AirPlay Receiver).
      - "5080:8080"

  web:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
    container_name: orv-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "8080:80"

volumes:
  pgdata:
